<svg class="ar-logo" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arkansas outline with town markers">
  <defs>
    <linearGradient id="arStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a8f7a"/>
      <stop offset="55%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#e07a3a"/>
    </linearGradient>
    <filter id="arGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Stylized Arkansas outline -->
  <path class="ar-outline"
    d="M42 48
       L78 38 L118 34 L148 36 L168 40 L178 48
       L182 62 L186 88 L188 118 L186 142 L178 158
       L162 168 L138 174 L108 178 L82 174 L58 164
       L46 148 L40 122 L36 92 L38 68 Z"
    fill="none" stroke="url(#arStroke)" stroke-width="2.2" stroke-linejoin="round"/>
  <path
    d="M42 48
       L78 38 L118 34 L148 36 L168 40 L178 48
       L182 62 L186 88 L188 118 L186 142 L178 158
       L162 168 L138 174 L108 178 L82 174 L58 164
       L46 148 L40 122 L36 92 L38 68 Z"
    fill="rgba(232,220,200,0.06)"/>
  <!-- Town pins (approximate positions) -->
  <g class="ar-pins" filter="url(#arGlow)">
    <circle cx="108" cy="112" r="3.2" fill="#e07a3a"/><!-- Little Rock -->
    <circle cx="68" cy="58" r="2.4" fill="#e8dcc8"/><!-- Fayetteville -->
    <circle cx="52" cy="78" r="2.2" fill="#e8dcc8"/><!-- Fort Smith -->
    <circle cx="148" cy="72" r="2.3" fill="#e8dcc8"/><!-- Jonesboro -->
    <circle cx="118" cy="138" r="2.2" fill="#e8dcc8"/><!-- Pine Bluff -->
    <circle cx="88" cy="118" r="2.1" fill="#e8dcc8"/><!-- Hot Springs -->
    <circle cx="58" cy="158" r="2.2" fill="#e8dcc8"/><!-- Texarkana -->
    <circle cx="98" cy="158" r="2.1" fill="#e8dcc8"/><!-- El Dorado -->
    <circle cx="128" cy="88" r="2.0" fill="#e8dcc8"/><!-- Searcy -->
    <circle cx="112" cy="58" r="2.0" fill="#e8dcc8"/><!-- Mountain Home -->
    <circle cx="158" cy="128" r="2.0" fill="#e8dcc8"/><!-- West Memphis -->
    <circle cx="78" cy="98" r="1.9" fill="#e8dcc8"/><!-- Russellville -->
  </g>
</svg>
